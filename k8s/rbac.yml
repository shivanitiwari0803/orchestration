apiVersion: v1
kind: ServiceAccount
metadata:
  name:  resource-manager

---
apiVersion: rbac.authorisation.k8s.io/v1
kind: Role
metadata: 
  name: resource-manager
rules:
- apiGroups: [""]
  resources: ["pods","services"]
  verbs: ["get","list","watch","create","delete"]

---
apiVersion: rbac.authorisation.k8s.io/v1
kind: RoleBinding
metadata: 
  name: resource-manager-binding
subjects:
- kind: serviceAccount
  name:  resource-manager
roleRef: 
  kind: Role
  name:  resource-manager
  apiGroup: rbac.authorisation.k8s.io
